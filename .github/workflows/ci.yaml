on:
  pull_request:
  workflow_dispatch:
name: ci

# https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#permissions
permissions:
  contents: read

jobs:
  linux:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc-14
            os: ubuntu-24.04
            cc: gcc-14
            cxx: g++-14
            coverage: true

          - name: linux-clang-18
            os: ubuntu-24.04
            cc: clang-18
            cxx: clang++-18
            fuzz: true
            bzlopts: "--config libfuzzer --config asan --config ubsan"

          - name: windows-msvc
            os: windows-2025

    steps:
      - run: echo "CC=${{ matrix.cc }}" >>$GITHUB_ENV && echo "CXX=${{ matrix.cxx }}" >>$GITHUB_ENV
        if: ${{ matrix.cc != '' }}
      - run: sudo apt-get update && sudo apt-get install --assume-yes --no-install-recommends lcov
        if: ${{ matrix.coverage }}
      - uses: actions/checkout@v6
      - run: bazel test ... ${{ matrix.bzlopts }}
        if: ${{ !matrix.coverage }}
      - run: bazel coverage ... ${{ matrix.bzlopts }}
        if: ${{ matrix.coverage }}
      - run: lcov --summary bazel-out/_coverage/_coverage_report.dat
        if: ${{ matrix.coverage }}
      - name: Upload
        # codecov-cli is from https://github.com/getsentry/prevent-cli
        run: |
          pipx install codecov-cli==11.2.8
          codecovcli upload-process --fail-on-error --file bazel-out/_coverage/_coverage_report.dat
        if: ${{ matrix.coverage }}
      - run: ./bzl/run_fuzz_tests ... ${{ matrix.bzlopts }} -- --timeout_secs=30
        if: ${{ matrix.fuzz }}

  pre-commit:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v6
      - run: pipx install pre-commit==4.5.1
      - run: pre-commit run --all-files

  clang-format:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v6
      - name: Set up the llvm repository
        run: |
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo apt-add-repository "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main"
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends clang-format-21
      - run: find . -name "*.h" -o -name "*.cc" | xargs clang-format-21 -style=file -i
      - run: git diff --exit-code

  buildifier:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v6
      - run: wget --output-document=buildifier https://github.com/bazelbuild/buildtools/releases/download/v8.5.1/buildifier-linux-amd64 && sudo chmod +x buildifier
      - run: ./buildifier --lint=warn --warnings=all -mode diff $(find . -type f -iname "*.bazel" -or -iname "*.bzl")

  prettier:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v6
      - run: npm install --global prettier@3.8.1
      - run: npx prettier --ignore-path .gitignore --write .
      - run: git diff --exit-code
